<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bojkela Barber - Zakazivanje termina</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #c5a059;
            --bg: #f9f9f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: #333;
        }

        .slots-container {
            margin-top: 24px;
        }

        .slots-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 6px;
        }

        .slot-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .slot-item {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
        }

        .slot-item.available:hover {
            border-color: var(--accent);
            background: #fdfaf3;
        }

        .slot-item.booked {
            background-color: #f5f5f5;
            color: #aaa;
            border-color: #eee;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .slot-item.selected {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: bold;
        }

        .install-box {
            margin-top: 24px;
            padding: 12px;
            background: #fdfaf3;
            border: 1px dashed var(--accent);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        .install-box button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bojkela Barber</h1>
        <div class="subtitle">Rezervacija termina</div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="firstName">Ime</label>
                <input type="text" id="firstName" required placeholder="Unesi ime...">
            </div>

            <div class="form-group">
                <label for="lastName">Prezime</label>
                <input type="text" id="lastName" required placeholder="Unesi prezime...">
            </div>

            <div class="form-group">
                <label for="phone">Broj telefona</label>
                <input type="tel" id="phone" required placeholder="npr. 0641234567">
            </div>

            <div class="form-group">
                <label for="bookingDate">Izaberi datum</label>
                <input type="date" id="bookingDate" required>
            </div>

            <div class="slots-container">
                <div class="slots-title">Dostupni termini</div>
                <div class="slot-list" id="slotList">
                    <!-- Generisani termini -->
                </div>
            </div>

            <button type="submit" class="btn" style="margin-top: 20px;">Potvrdi zakazivanje</button>
        </form>

        <div class="install-box" id="installContainer" style="display:none;">
            <div>Instaliraj Bojkela Barber aplikaciju na telefon!</div>
            <button id="installBtn">Instaliraj</button>
        </div>
    </div>

    <script>
        // Postavi današnji datum kao podrazumevani
        const dateInput = document.getElementById('bookingDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        dateInput.min = today;

        let selectedTime = null;

        // Primer termina od 10:00 do 18:00
        const times = ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30"];
        
        // Lažno zauzeti termini za demonstraciju (možeš menjati)
        let bookedSlots = {
            [today]: ["11:00", "14:30"]
        };

        function renderSlots() {
            const slotList = document.getElementById('slotList');
            slotList.innerHTML = '';
            const currentDate = dateInput.value;
            const currentBookings = bookedSlots[currentDate] || [];

            times.forEach(time => {
                const div = document.createElement('div');
                div.classList.add('slot-item');
                
                if (currentBookings.includes(time)) {
                    div.classList.add('booked');
                    div.innerText = time + ' (Zauzeto)';
                } else {
                    div.classList.add('available');
                    div.innerText = time;
                    if (selectedTime === time) {
                        div.classList.add('selected');
                    }
                    div.onclick = () => {
                        document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectedTime = time;
                    };
                }
                slotList.appendChild(div);
            });
        }

        dateInput.onchange = () => {
            selectedTime = null;
            renderSlots();
        };

        renderSlots();

        document.getElementById('bookingForm').onsubmit = (e) => {
            e.preventDefault();
            const fName = document.getElementById('firstName').value;
            const lName = document.getElementById('lastName').value;
            const phone = document.getElementById('phone').value;
            const date = dateInput.value;

            if (!selectedTime) {
                alert('Molimo izaberi slobodan termin!');
                return;
            }

            // Upisivanje u zauzete za test
            if (!bookedSlots[date]) bookedSlots[date] = [];
            bookedSlots[date].push(selectedTime);

            alert(`Uspešno zakazano!\n\nKlijent: ${fName} ${lName}\nTelefon: ${phone}\nDatum: ${date}\nVreme: ${selectedTime}`);
            
            selectedTime = null;
            document.getElementById('bookingForm').reset();
            dateInput.value = date;
            renderSlots();
        };

        // PWA instalacija (opciono)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installContainer').style.display = 'block';
        });

        document.getElementById('installBtn').onclick = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installContainer').style.display = 'none';
                }
                deferredPrompt = null;
            }
        };
    </script>
</body>
</html>
