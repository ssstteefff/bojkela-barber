<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bojkela Barber - Premium Rezervacija</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0d0d0d;
            --card-black: #161616;
            --border-gold: #c5a059;
            --gold: #d4af37;
            --gold-hover: #e5c158;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-black);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--border-gold);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background-color: #0b0b0b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--border-gold);
            margin: 24px 0 12px 0;
            font-weight: 600;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .slot {
            background: #0b0b0b;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slot:hover:not(.booked) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .slot.selected {
            background: var(--gold);
            color: #000;
            font-weight: 600;
            border-color: var(--gold);
        }

        .slot.booked {
            background: #111;
            color: #444;
            border-color: #222;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Bojkela Barber</h1>
            <p>Exclusive Hair & Beard Lounge</p>
        </div>

        <div class="form-group">
            <label>Ime</label>
            <input type="text" placeholder="Unesi ime...">
        </div>

        <div class="form-group">
            <label>Prezime</label>
            <input type="text" placeholder="Unesi prezime...">
        </div>

        <div class="form-group">
            <label>Broj telefona</label>
            <input type="text" placeholder="npr. 0641234567">
        </div>

        <div class="form-group">
            <label>Izaberi datum</label>
            <input type="date" value="2026-11-16">
        </div>

        <div class="section-title">Dostupni termini</div>
        <div class="slots-grid">
            <div class="slot">10:00</div>
            <div class="slot">10:30</div>
            <div class="slot booked">11:00</div>
            <div class="slot selected">11:30</div>
            <div class="slot">12:00</div>
            <div class="slot">12:30</div>
            <div class="slot">13:00</div>
            <div class="slot">13:30</div>
            <div class="slot">14:00</div>
            <div class="slot booked">14:30</div>
            <div class="slot">15:00</div>
            <div class="slot">15:30</div>
        </div>

        <button class="btn-submit">Potvrdi zakazivanje</button>
    </div>

</body>
</html>
